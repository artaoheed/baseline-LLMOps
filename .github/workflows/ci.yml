name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./starter/backend
            lang: python
          - name: frontend
            context: ./starter/frontend
            lang: node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend tests
        if: matrix.lang == 'python'
        working-directory: ${{ matrix.context }}
        run: |
          pip install -r requirements.txt
          pytest -q || echo "No backend tests yet — add pytest cases, then drop this fallback."

      - name: Set up Node
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend build & tests
        if: matrix.lang == 'node'
        working-directory: ${{ matrix.context }}
        run: |
          npm ci
          npm run build --if-present
          npm test --if-present

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./starter/backend
            image: platform-backend
          - name: frontend
            context: ./starter/frontend
            image: platform-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image ref
        id: meta
        run: |
          ref="${REGISTRY}/${IMAGE_OWNER}/${{ matrix.image }}"
          echo "ref=${ref,,}" >> "$GITHUB_OUTPUT"

      - name: Build image (load into runner)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ref }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag ${{ steps.meta.outputs.ref }}:${{ github.sha }} ${{ steps.meta.outputs.ref }}:latest
          docker push ${{ steps.meta.outputs.ref }}:${{ github.sha }}
          docker push ${{ steps.meta.outputs.ref }}:latest
