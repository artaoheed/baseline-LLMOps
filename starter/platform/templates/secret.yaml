{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-secret
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secret.POSTGRES_USER is required (pass via -f secrets.values.yaml or --set)" .Values.secret.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "secret.POSTGRES_PASSWORD is required" .Values.secret.POSTGRES_PASSWORD | quote }}
  DATABASE_URL: {{ required "secret.DATABASE_URL is required" .Values.secret.DATABASE_URL | quote }}
{{- end }}